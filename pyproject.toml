[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61",
  "wheel",
]

[project]
name = "serverlessworkflow-sdk"
version = "1.0.0"  # TODO: Update to 2.0.0 for spec 1.0 migration
description = "Serverless Workflow Specification - Python SDK"
readme = "README.md"
keywords = [
  "cloud",
  "cncf",
  "dsl",
  "orchestration",
  "serverless",
  "workflow",
]
license = "Apache-2.0"
maintainers = [
    {name = "Serverless Workflow Contributors"},
]
authors = [
    {name = "Serverless Workflow Contributors"},
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "jsonschema<5.0,>=4.4",
  "pyyaml<7.0,>=6",
  "requests>=2.25",
  "transitions<1.0,>=0.9.2",
]
[project.optional-dependencies]
all = [
  "serverlessworkflow.sdk[dev,docs]",
]
dev = [
  "bandit[toml]>=1.7",
  "mypy>=1",
  "pytest>=7",
  "pytest-cov>=4",
  "pytest-xdist>=3",
  "ruff>=0.1",
  "types-PyYAML",
  "types-requests",
]
docs = [
  "myst-parser>=2", # Markdown support in Sphinx
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
]
viz = [
  "pydot>=4.0.1",
]
[project.urls]
Changelog = "https://github.com/serverlessworkflow/sdk-python/releases"
Documentation = "https://github.com/serverlessworkflow/sdk-python/blob/main/README.md"
Homepage = "https://serverlessworkflow.io/"
Issues = "https://github.com/serverlessworkflow/sdk-python/issues"
Repository = "https://github.com/serverlessworkflow/sdk-python"

[tool.setuptools]
packages = ["serverlessworkflow", "serverlessworkflow.sdk"]

[tool.setuptools.package-data]
serverlessworkflow = ["py.typed"]  # Mark as PEP 561 compliant (typed package)

# Pytest configuration

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip strict (Python 3.10+)
]
extend-select = ["D"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/*" = ["ARG", "SIM"]  # Allow unused args and complex logic in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

# Bandit configuration (security linting)

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--strict-config",
    "--cov=serverlessworkflow",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "spec_example: marks tests that validate against spec examples",
]

# Coverage configuration

[tool.coverage.run]
source = ["serverlessworkflow"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Ruff configuration (modern linter/formatter, replaces black + flake8 + isort)

[tool.bandit]
exclude_dirs = ["tests", "test_*.py", "*_test.py"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]
